<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f9d0b0"/>
      <stop offset="100%" stop-color="#e8b48a"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5aad"/>
      <stop offset="100%" stop-color="#3a468a"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="420" height="520" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="370" cy="70" r="110" fill="rgba(255,255,255,0.06)"/>
  <circle cx="55"  cy="450" r="130" fill="rgba(255,255,255,0.04)"/>

  <!-- Austin skyline silhouette -->
  <g fill="rgba(0,0,0,0.18)">
    <rect x="0"   y="380" width="30"  height="140"/>
    <rect x="25"  y="355" width="22"  height="165"/>
    <rect x="42"  y="370" width="18"  height="150"/>
    <rect x="56"  y="340" width="25"  height="180"/>
    <rect x="76"  y="360" width="16"  height="160"/>
    <rect x="88"  y="375" width="20"  height="145"/>
    <!-- Capitol dome -->
    <ellipse cx="140" cy="340" rx="22" ry="14" fill="rgba(0,0,0,0.18)"/>
    <rect x="122" y="340" width="36"  height="160"/>
    <rect x="112" y="355" width="56"  height="145"/>
    <rect x="168" y="368" width="18"  height="152"/>
    <rect x="182" y="378" width="14"  height="142"/>
    <rect x="270" y="360" width="20"  height="160"/>
    <rect x="286" y="345" width="26"  height="175"/>
    <rect x="308" y="370" width="18"  height="150"/>
    <rect x="322" y="358" width="24"  height="162"/>
    <rect x="342" y="380" width="16"  height="140"/>
    <rect x="354" y="365" width="22"  height="155"/>
    <rect x="372" y="375" width="48"  height="145"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="460" width="420" height="60" fill="rgba(0,0,0,0.22)"/>

  <!-- Body / blouse -->
  <path d="M 60 520 Q 62 400 130 375 L 158 365 Q 210 378 210 378 Q 210 378 262 365 L 290 375 Q 358 400 360 520 Z" fill="url(#shirt)"/>

  <!-- Collar -->
  <path d="M 158 365 L 210 400 L 262 365" stroke="rgba(255,255,255,0.55)" stroke-width="2.5" fill="none" stroke-linejoin="round"/>

  <!-- Scarf/accent -->
  <path d="M 158 365 Q 178 420 210 430 Q 242 420 262 365 L 255 368 Q 238 415 210 424 Q 182 415 165 368 Z" fill="rgba(255,160,80,0.45)"/>

  <!-- Neck -->
  <rect x="190" y="330" width="40" height="38" rx="8" fill="url(#skin)"/>

  <!-- Hair (back layer) -->
  <ellipse cx="210" cy="215" rx="102" ry="112" fill="#3a1f0d"/>

  <!-- Face -->
  <ellipse cx="210" cy="235" rx="78" ry="88" fill="url(#skin)"/>

  <!-- Hair (front — frames face) -->
  <ellipse cx="210" cy="160" rx="100" ry="72" fill="#3a1f0d"/>
  <!-- Side hair left -->
  <path d="M 110 200 Q 100 270 112 340 Q 122 360 135 340 Q 130 290 132 230" fill="#3a1f0d"/>
  <!-- Side hair right -->
  <path d="M 310 200 Q 320 270 308 340 Q 298 360 285 340 Q 290 290 288 230" fill="#3a1f0d"/>
  <!-- Hair shine highlight -->
  <path d="M 165 145 Q 195 132 230 145" stroke="#7a4a25" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M 175 150 Q 200 139 225 150" stroke="#9a6a40" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.35"/>

  <!-- Eyebrows -->
  <path d="M 168 210 Q 185 203 200 207" stroke="#2d1505" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 220 207 Q 235 203 252 210" stroke="#2d1505" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Eyes (whites) -->
  <ellipse cx="183" cy="227" rx="13" ry="12" fill="white"/>
  <ellipse cx="237" cy="227" rx="13" ry="12" fill="white"/>
  <!-- Irises -->
  <circle cx="183" cy="229" r="9"  fill="#5c3820"/>
  <circle cx="237" cy="229" r="9"  fill="#5c3820"/>
  <!-- Pupils -->
  <circle cx="183" cy="229" r="5"  fill="#1a0a04"/>
  <circle cx="237" cy="229" r="5"  fill="#1a0a04"/>
  <!-- Eye shines -->
  <circle cx="186" cy="226" r="3.2" fill="white" opacity="0.7"/>
  <circle cx="240" cy="226" r="3.2" fill="white" opacity="0.7"/>
  <!-- Lower eyelids -->
  <path d="M 171 234 Q 183 240 195 234" stroke="#d49070" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 225 234 Q 237 240 249 234" stroke="#d49070" stroke-width="1.2" fill="none" opacity="0.6"/>

  <!-- Nose -->
  <path d="M 210 245 Q 204 260 205 268 Q 210 274 215 268 Q 216 260 210 245" fill="#d4956a" opacity="0.55"/>
  <ellipse cx="205" cy="270" rx="6" ry="4" fill="#c47858" opacity="0.4"/>
  <ellipse cx="215" cy="270" rx="6" ry="4" fill="#c47858" opacity="0.4"/>

  <!-- Lips -->
  <path d="M 188 288 Q 210 282 232 288" fill="#c87058"/>
  <path d="M 188 288 Q 210 302 232 288 Q 220 295 210 296 Q 200 295 188 288 Z" fill="#b85e45"/>
  <path d="M 188 288 Q 210 282 232 288" stroke="#a04030" stroke-width="1" fill="none"/>
  <!-- Lip highlight -->
  <path d="M 197 286 Q 210 283 223 286" stroke="rgba(255,200,180,0.45)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Cheeks blush -->
  <ellipse cx="163" cy="262" rx="18" ry="11" fill="#f0a0a0" opacity="0.22" filter="url(#soft)"/>
  <ellipse cx="257" cy="262" rx="18" ry="11" fill="#f0a0a0" opacity="0.22" filter="url(#soft)"/>

  <!-- Earrings -->
  <circle cx="130" cy="255" r="5" fill="#f0c040" opacity="0.85"/>
  <circle cx="290" cy="255" r="5" fill="#f0c040" opacity="0.85"/>

  <!-- Name plate -->
  <rect x="0" y="455" width="420" height="65" fill="rgba(0,0,0,0.38)"/>
  <text x="210" y="484" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="white" font-weight="bold" letter-spacing="1.2">Tatiana Orlova</text>
  <text x="210" y="506" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="rgba(255,255,255,0.78)" letter-spacing="0.8">Austin City Tours · Guide</text>
</svg>
